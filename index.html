<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medidor de Rentabilidad de Inversiones</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div>
      <h1 data-i18n="title"></h1>
      <p class="sub" data-i18n="subtitle"></p>
    </div>
    <div class="toolbar">
      <label><span data-i18n="language"></span>
        <select id="lang"><option value="es">Español</option><option value="en">English</option></select>
      </label>
      <label><span data-i18n="currency"></span>
        <select id="currency"><option value="CLP">CLP</option><option value="USD">USD</option></select>
      </label>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2 data-i18n="general"></h2>
      <div class="grid" id="general">
        <label><span data-i18n="horizon"></span><input type="number" id="horizon" min="1" max="360" step="1"></label>
        <label><span data-i18n="inflation"></span><input type="number" id="inflation" step="any"></label>
        <label><span data-i18n="benchName"></span><input type="text" id="benchName"></label>
        <label><span data-i18n="benchRate"></span><input type="number" id="benchRate" step="any"></label>
        <label><span data-i18n="fx"></span><input type="number" id="fx" min="1" step="any"></label>
      </div>
      <p class="hint"><span data-i18n="hintHorizon"></span> <span data-i18n="hintInfl"></span></p>
      <div class="actions">
        <button id="btnSave" data-i18n="save"></button>
        <button id="btnLoad" data-i18n="load"></button>
        <input type="file" id="fileInput" accept="application/json,.json" hidden>
        <button id="btnCsv" data-i18n="csv"></button>
        <button id="btnReset" class="ghost" data-i18n="reset"></button>
        <button id="btnClear" class="ghost" data-i18n="clear"></button>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>

    <section class="panel">
      <div class="row">
        <h2 data-i18n="investments"></h2>
        <div class="actions">
          <select id="tplSelect" aria-label="Template"></select>
          <button id="btnAdd" class="primary" data-i18n="add"></button>
        </div>
      </div>
      <div id="invList"></div>
    </section>

    <section class="panel">
      <h2 data-i18n="results"></h2>
      <div id="results" class="table-wrap"></div>
      <p class="hint" data-i18n="tip"></p>
    </section>

    <section class="panel">
      <h2 data-i18n="charts"></h2>
      <h3 data-i18n="ch_evolution"></h3>
      <div class="chart"><canvas id="chEvolution"></canvas></div>
      <h3 data-i18n="ch_compare"></h3>
      <div class="chart"><canvas id="chCompare"></canvas></div>
      <div class="row">
        <h3 data-i18n="ch_dist"></h3>
        <label class="inline"><span data-i18n="ch_pick"></span> <select id="distPick"></select></label>
      </div>
      <div class="chart"><canvas id="chDist"></canvas></div>
      <p id="distNote" class="hint"></p>
    </section>
  </main>

  <footer><p data-i18n="disclaimer"></p></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
